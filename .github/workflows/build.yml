name: Build & Test libspecbleach

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Standard Release"
            cmake_flags: "-DENABLE_TESTS=ON -DENABLE_EXAMPLES=ON"
          - name: "Sanitizers (ASan + UBSan)"
            cmake_flags: "-DENABLE_TESTS=ON -DENABLE_EXAMPLES=ON -DENABLE_SANITIZERS=ON"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq \
            cmake \
            libfftw3-dev \
            libsndfile1-dev \
            libomp-dev

      - name: Configure build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.config.cmake_flags }}

      - name: Build project
        run: |
          cmake --build build --config Release -j4

      - name: Run CTest Suite
        run: |
          cd build && ctest --output-on-failure --test-dir .
